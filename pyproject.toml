[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rppg-dtsp"
version = "0.1.0"
description = "Contactless pulse estimation from RGB video — four rPPG projections benchmarked"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
roi = ["mediapipe>=0.10.14"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["rppg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
